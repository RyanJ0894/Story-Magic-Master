name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @story-magic/shared exec prisma generate

      - name: Type check web
        run: pnpm --filter @story-magic/web typecheck

      - name: Type check orchestrator
        run: pnpm --filter @story-magic/orchestrator typecheck

      - name: Lint orchestrator
        run: pnpm --filter @story-magic/orchestrator lint

      - name: Lint web
        run: pnpm --filter @story-magic/web lint

      # H3 — fail the build if a PR adds envVars: or changes
      # buildCommand: in render.yaml. Doppler owns env vars, the Render
      # service dashboard owns build commands. See docs/ENV-SOURCE-OF-TRUTH.md.
      - name: Env source-of-truth check (self-tests)
        run: node scripts/check-env-source.test.js

      - name: Env source-of-truth check (render.yaml diff)
        run: |
          git fetch origin main --depth=1 || true
          node scripts/check-env-source.js --diff

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @story-magic/shared exec prisma generate

      - name: Run shared tests
        run: pnpm --filter @story-magic/shared test
        env:
          CI: true

      - name: Run orchestrator tests
        run: pnpm --filter @story-magic/orchestrator test
        env:
          CI: true

      - name: Run web unit tests
        run: pnpm --filter @story-magic/web test
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/**/*.ts', 'packages/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Generate Prisma client
        run: pnpm --filter @story-magic/shared exec prisma generate

      - name: Build orchestrator
        run: pnpm --filter @story-magic/orchestrator build

      - name: Build web
        run: pnpm --filter @story-magic/web build
        env:
          # The Next.js + Sentry + Prisma build of the web package recently
          # crossed Node's default ~2 GB heap on GitHub-hosted runners
          # (`FATAL ERROR: Ineffective mark-compacts near heap limit Allocation
          # failed - JavaScript heap out of memory`). Bumping to 4 GB clears it
          # with headroom; ubuntu-latest runners ship with ~7 GB of memory.
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
