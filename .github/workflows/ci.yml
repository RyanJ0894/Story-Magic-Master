name: CI

on:
  push:
    branches: [main, feat/clerk-prisma-migration]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check web
        run: pnpm --filter @story-magic/web typecheck

      - name: Type check orchestrator
        run: pnpm --filter @story-magic/orchestrator typecheck

      - name: Lint orchestrator
        run: pnpm --filter @story-magic/orchestrator lint

      - name: Lint web
        run: pnpm --filter @story-magic/web lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run orchestrator tests
        run: pnpm --filter @story-magic/orchestrator test
        env:
          CI: true

      - name: Run web unit tests
        run: pnpm --filter @story-magic/web test
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @story-magic/web exec prisma generate

      - name: Build web
        run: pnpm --filter @story-magic/web build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    # Only run E2E on main branch to save CI minutes
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @story-magic/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @story-magic/web test:e2e --project=chromium
        env:
          CI: true
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/clerk-prisma-migration'
    steps:
      - name: Deploy Web
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
        if: env.RENDER_DEPLOY_HOOK_WEB != ''
        env:
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}

      - name: Deploy Orchestrator
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_ORCHESTRATOR }}"
        if: env.RENDER_DEPLOY_HOOK_ORCHESTRATOR != ''
        env:
          RENDER_DEPLOY_HOOK_ORCHESTRATOR: ${{ secrets.RENDER_DEPLOY_HOOK_ORCHESTRATOR }}
