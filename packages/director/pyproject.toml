[project]
name = "story-magic-director"
version = "1.0.0"
description = "AI Director Agent for script parsing and audio direction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "litellm>=1.80.7",
    "openai>=1.6.0",
    "google-adk>=1.18.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "nest-asyncio>=1.6.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "supabase>=2.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
