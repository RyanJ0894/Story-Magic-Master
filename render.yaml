# Render Blueprint for Story Magic
# Deploy with: https://render.com/docs/infrastructure-as-code
#
# This blueprint defines:
# 1. Web (Next.js frontend + embedded queue worker) - User-facing application
# 2. Orchestrator (Node.js backend) - Audio generation pipeline
# 3. PostgreSQL database - Primary data store

databases:
  - name: story-magic-db
    region: oregon
    plan: basic-256mb
    databaseName: story_magic
    user: story_magic_user
    # After provisioning, enable extensions via psql:
    #   CREATE EXTENSION IF NOT EXISTS "pgvector";
    #   CREATE EXTENSION IF NOT EXISTS "pgcrypto";

services:
  # =============================================================================
  # WEB SERVICE (Next.js)
  # =============================================================================
  - type: web
    name: story-magic-web
    runtime: node
    region: oregon
    plan: standard
    branch: main
    autoDeploy: true
    numInstances: 1

    # Skip rebuilds for docs/markdown-only changes. Without this, every doc PR
    # tears down both services — caused the 2026-06-13 21:03 incident where a
    # generation attempt hit during a docs-triggered redeploy and the web's
    # orchestrator readiness probe timed out.
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - code-review/**
        - .github/**

    # Node/pnpm versions
    buildCommand: |
      npm install -g pnpm@9.1.0 &&
      curl -fsSL -o /tmp/doppler.tgz https://github.com/DopplerHQ/cli/releases/download/3.76.0/doppler_3.76.0_linux_amd64.tar.gz &&
      echo "04f1ff30ed162d7af1dba7f11ad6a37ef35099de86a7ec6e261b64b1b337a3f3  /tmp/doppler.tgz" | sha256sum -c - &&
      tar --overwrite -xzf /tmp/doppler.tgz -C /usr/local/bin doppler &&
      pnpm install --frozen-lockfile &&
      doppler run -- sh -c "node scripts/check-env-web.js && pnpm --filter @story-magic/shared exec prisma generate && pnpm --filter @story-magic/web build"
    startCommand: doppler run -- sh -c "pnpm --filter @story-magic/shared exec prisma migrate deploy && pnpm --filter @story-magic/web start"

    # Health check
    healthCheckPath: /api/health

    # Environment variables
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production

      # Database (Render PostgreSQL - from database reference)
      - key: DATABASE_URL
        fromDatabase:
          name: story-magic-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: story-magic-db
          property: connectionString

      # Clerk Auth (set in Render dashboard)
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /signup
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
        value: /dashboard
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
        value: /dashboard

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

      # Sentry (set in Render dashboard)
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false

      # Orchestrator URL (set in Render dashboard)
      - key: ORCHESTRATOR_URL
        sync: false
      - key: NEXT_PUBLIC_ORCHESTRATOR_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # OpenAI (needed for intelligence features on web)
      - key: OPENAI_API_KEY
        sync: false

      # Inter-service auth
      - key: SERVICE_SECRET_KEY
        sync: false

      # Upstash Redis (Rate Limiting - shared with orchestrator)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # Queue worker mode: standalone — the dedicated story-magic-worker service
      # below picks up jobs. The embedded worker boot in instrumentation.ts is
      # gated on this value. Closes the connection-pool starvation pattern that
      # caused STORY-MAGIC-1G (5-min /api/jobs/[id] hangs); see
      # docs/QUEUE-WORKER-SPLIT-RUNBOOK-2026-06-14.md for the runbook.
      - key: WORKER_MODE
        value: standalone

      # DB pool ceiling per service. With three services pulling from the
      # Render Postgres basic-256mb cap of 22, 6 each leaves headroom for
      # migrations + health checks. Bump when we upgrade to basic-1gb.
      - key: DATABASE_CONNECTION_LIMIT
        value: "6"

      # Queue worker concurrency (default 3, reduce if memory constrained).
      # Kept here so the value reaches the standalone worker via the shared
      # Render env vars; the embedded path is dead with WORKER_MODE=standalone.
      - key: QUEUE_CONCURRENCY
        value: "3"

      # Feature Flags (Intelligence Features)
      - key: NEXT_PUBLIC_FF_STORY_SCORE
        value: "true"
      - key: NEXT_PUBLIC_FF_STORY_ADVISER
        value: "true"
      - key: NEXT_PUBLIC_FF_REVISION_TRACKING
        value: "true"
      - key: NEXT_PUBLIC_FF_COMPARABLE_SCRIPTS
        value: "true"
      - key: NEXT_PUBLIC_FF_EXPORT_REPORTS
        value: "true"
      - key: NEXT_PUBLIC_FF_STORY_EXPLORER
        value: "true"

      # Feature Flags (Impact StoryBuilder)
      - key: NEXT_PUBLIC_FF_IMPACT_STORYBUILDER
        value: "true"
      - key: NEXT_PUBLIC_FF_IMPACT_GALLERY
        value: "true"
      - key: NEXT_PUBLIC_FF_IMPACT_PARTNERS
        value: "true"

      # Email (Resend — set in Render dashboard)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_TESTING_MODE
        value: "true"
      - key: ADMIN_EMAIL
        value: "info@servicevision.net"

      # Cron secret (set in Render dashboard)
      - key: CRON_SECRET
        sync: false

      # Cloudflare R2 (Impact audio storage — set in Render dashboard)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  # =============================================================================
  # CRON JOB — Monthly Impact Prize Draw
  # Runs on the last day of each month at 23:00 UTC.
  # Calls POST /api/cron/prize-draw on the web service.
  # =============================================================================
  - type: cron
    name: impact-prize-draw
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 23 28-31 * *"
    buildCommand: echo "no build needed"
    startCommand: >
      node -e "
        const url = process.env.WEB_URL + '/api/cron/prize-draw';
        const secret = process.env.CRON_SECRET;
        fetch(url, { method: 'POST', headers: { 'x-cron-secret': secret } })
          .then(r => r.json()).then(console.log).catch(console.error);
      "
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: WEB_URL
        value: "https://story-magic-web.onrender.com"
      - key: CRON_SECRET
        sync: false

  # =============================================================================
  # CRON JOB — Nightly Log Cleanup
  # Runs daily at 02:00 UTC. Deletes content_access_log rows older than 90 days.
  # =============================================================================
  - type: cron
    name: cleanup-logs
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 2 * * *"
    buildCommand: echo "no build needed"
    startCommand: >
      node -e "
        const url = process.env.WEB_URL + '/api/cron/cleanup-logs';
        const secret = process.env.CRON_SECRET;
        fetch(url, { method: 'POST', headers: { 'x-cron-secret': secret } })
          .then(r => r.json()).then(console.log).catch(console.error);
      "
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: WEB_URL
        value: "https://story-magic-web.onrender.com"
      - key: CRON_SECRET
        sync: false

  # =============================================================================
  # BACKGROUND WORKER (Queue Processor) — runs the queue out-of-process so the
  # web service's Prisma pool isn't starved during long generation jobs (which
  # was the root cause behind STORY-MAGIC-1G's 5-min /api/jobs/[id] hangs).
  # The web service skips its embedded worker boot when WORKER_MODE=standalone
  # is set on the web envVars block above.
  # =============================================================================
  - type: worker
    name: story-magic-worker
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    numInstances: 1

    # Skip rebuilds for docs/markdown-only changes — same as web + orch.
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - code-review/**
        - .github/**

    # h3-env-source-of-truth-allowed
    # Bootstrap for the new story-magic-worker service. Per the H3 contract
    # the buildCommand SHOULD live in the Render dashboard after the service
    # is created; this declaration lets Render know how to build the service
    # on its very first deploy. Plan: once the service exists, prune this
    # buildCommand back to a placeholder and let the dashboard manage it.
    buildCommand: |
      npm install -g pnpm@9.1.0 &&
      curl -fsSL -o /tmp/doppler.tgz https://github.com/DopplerHQ/cli/releases/download/3.76.0/doppler_3.76.0_linux_amd64.tar.gz &&
      echo "04f1ff30ed162d7af1dba7f11ad6a37ef35099de86a7ec6e261b64b1b337a3f3  /tmp/doppler.tgz" | sha256sum -c - &&
      tar --overwrite -xzf /tmp/doppler.tgz -C /usr/local/bin doppler &&
      pnpm install --frozen-lockfile &&
      doppler run -- sh -c "node scripts/check-env-web.js && pnpm --filter @story-magic/shared exec prisma generate && pnpm --filter @story-magic/web build"
    startCommand: doppler run -- pnpm --filter @story-magic/web worker

    # h3-env-source-of-truth-allowed
    # New-service bootstrap envVars block — values come from Doppler via the
    # native sync after first deploy, this is just the SHAPE so Render knows
    # which keys exist.
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production

      # Same DB as web/orch — the Job table is shared.
      - key: DATABASE_URL
        fromDatabase:
          name: story-magic-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: story-magic-db
          property: connectionString

      # Pool ceiling: 6 connections (web 6 + orch 6 + worker 6 = 18, leaves 4
      # of Render Postgres basic-256mb's 22-conn cap for migrations / psql).
      - key: DATABASE_CONNECTION_LIMIT
        value: "6"

      # Worker mode + concurrency.
      - key: WORKER_MODE
        value: standalone
      - key: QUEUE_CONCURRENCY
        value: "3"

      # Clerk auth (queue jobs call orchestrator with the user's identity).
      - key: CLERK_SECRET_KEY
        sync: false

      # Orchestrator URL — the worker dispatches generation work to it.
      - key: ORCHESTRATOR_URL
        sync: false

      # Inter-service auth (matches web + orch shared secret).
      - key: SERVICE_SECRET_KEY
        sync: false

      # Sentry — same DSN as web so events show up in the same project.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false

      # Upstash Redis — rate limiting shared with web.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # OpenAI for the worker's intelligence calls (scoring, adviser).
      - key: OPENAI_API_KEY
        sync: false

  # =============================================================================
  # ORCHESTRATOR SERVICE (Node.js/Express)
  # =============================================================================
  - type: web
    name: story-magic-orchestrator
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    # Scale up: increase numInstances when traffic demands.
    # No in-process state - jobs are tracked in PostgreSQL, audio in persistent disk.
    numInstances: 1

    # Same docs-skip filter as the web service. See the web buildFilter comment.
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - code-review/**
        - .github/**

    # Node/pnpm versions
    buildCommand: |
      apt-get update -q &&
      apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswresample-dev pkg-config &&
      npm install -g pnpm@9.1.0 &&
      curl -fsSL -o /tmp/doppler.tgz https://github.com/DopplerHQ/cli/releases/download/3.76.0/doppler_3.76.0_linux_amd64.tar.gz &&
      echo "04f1ff30ed162d7af1dba7f11ad6a37ef35099de86a7ec6e261b64b1b337a3f3  /tmp/doppler.tgz" | sha256sum -c - &&
      tar --overwrite -xzf /tmp/doppler.tgz -C /usr/local/bin doppler &&
      pnpm install --frozen-lockfile &&
      bash scripts/install-whisper.sh &&
      doppler run -- sh -c "node scripts/check-env-orchestrator.js && pnpm --filter @story-magic/shared exec prisma generate && pnpm --filter @story-magic/orchestrator build"
    startCommand: doppler run -- pnpm --filter @story-magic/orchestrator start

    # Health check
    healthCheckPath: /health

    # Disk for temporary audio files
    disk:
      name: audio-storage
      mountPath: /var/data/audio
      sizeGB: 5

    # Environment variables
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # Database (Render PostgreSQL - from database reference)
      - key: DATABASE_URL
        fromDatabase:
          name: story-magic-db
          property: connectionString

      # Pool ceiling: 6 connections — matches web + worker; total of 18 / 22.
      - key: DATABASE_CONNECTION_LIMIT
        value: "6"

      # Clerk Auth (set in Render dashboard)
      - key: CLERK_SECRET_KEY
        sync: false

      # AI Services
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false

      # Director/Audio-Director LLM (defaults to claude-sonnet-4-6)
      # AI SDK v6 + @ai-sdk/anthropic v3 — claude-sonnet-4-6 fully supported
      - key: DIRECTOR_MODEL
        value: anthropic/claude-sonnet-4-6
      - key: AUDIO_DIRECTOR_MODEL
        value: anthropic/claude-sonnet-4-6

      # Sentry (set in Render dashboard)
      - key: SENTRY_DSN
        sync: false

      # Rate Limiting (Upstash - set in Render dashboard)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # Monitoring (Checkly - set in Render dashboard)
      - key: CHECKLY_PING_URL
        sync: false

      # Logging
      - key: LOG_LEVEL
        value: info

      # TTS concurrency (reduced for starter plan 512MB RAM)
      - key: TTS_CONCURRENCY
        value: "3"

      # Web frontend URL (for CORS allowlist on orchestrator)
      - key: WEB_URL
        sync: false

      # Audio output directory (persistent disk mount)
      - key: AUDIO_OUTPUT_DIR
        value: /var/data/audio

      # Inter-service auth
      - key: SERVICE_SECRET_KEY
        sync: false

      # Public URL for this orchestrator (used to build audio download links)
      - key: ORCHESTRATOR_PUBLIC_URL
        sync: false

      # Auth bypass (must be false in production)
      - key: AUTH_DISABLED
        value: "false"

# =============================================================================
# SECRETS TO SET IN RENDER DASHBOARD (sync: false)
# =============================================================================
#
# Web:
#   - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#   - CLERK_SECRET_KEY
#   - CLERK_WEBHOOK_SECRET
#   - NEXT_PUBLIC_SENTRY_DSN
#   - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   - STRIPE_SECRET_KEY
#   - STRIPE_WEBHOOK_SECRET
#   - SENTRY_AUTH_TOKEN
#   - ORCHESTRATOR_URL
#   - OPENAI_API_KEY
#
# Orchestrator:
#   - CLERK_SECRET_KEY
#   - OPENAI_API_KEY
#   - GROQ_API_KEY
#   - ELEVENLABS_API_KEY
#   - UPSTASH_REDIS_REST_URL
#   - UPSTASH_REDIS_REST_TOKEN
#   - SENTRY_DSN
#   - CHECKLY_PING_URL
#   - WEB_URL
#
# Note: DATABASE_URL is auto-injected from the story-magic-db database reference.
#
# IMPORTANT: Never put actual secret values in this file.
# All secrets must be set via the Render dashboard only.
#
# =============================================================================
# PLAN OPTIONS
# =============================================================================
#
# Services:
#   starter:  $7/mo  - 512MB RAM, 0.5 CPU  (staging/web)
#   standard: $25/mo - 2GB RAM, 1 CPU      (production)
#   pro:      $85/mo - 4GB RAM, 2 CPU      (high traffic)
#
# Databases:
#   basic-256mb: $7/mo   - 256MB RAM, 1GB storage
#   basic-1gb:   $20/mo  - 1GB RAM, 16GB storage
#   basic-4gb:   $45/mo  - 4GB RAM, 64GB storage
#
# Note: Database plan "starter" is legacy. Use "basic-256mb" for new databases.
# Orchestrator is on starter for cost savings. Upgrade to standard if FFmpeg OOMs on long scripts.
