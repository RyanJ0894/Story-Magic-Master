# Render Blueprint for Story Magic
# Deploy with: https://render.com/docs/infrastructure-as-code
#
# This blueprint defines two services:
# 1. Web (Next.js frontend) - User-facing application
# 2. Orchestrator (Node.js backend) - Audio generation pipeline

services:
  # =============================================================================
  # WEB SERVICE (Next.js)
  # =============================================================================
  - type: web
    name: story-magic-web
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    numInstances: 1

    # Node/pnpm versions
    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@latest --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @story-magic/web build
    startCommand: pnpm --filter @story-magic/web start

    # Health check
    healthCheckPath: /

    # Environment variables
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production

      # Supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://vycfkqkdaszlhvaedxub.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_iC0xz4Fakt9BNb88nDV2iA_2luzdMt4

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

      # Sentry
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: https://b06f55eedd1ad8fdedc4cabc42c48c12@o4510606462550016.ingest.us.sentry.io/4510733770948608
      - key: SENTRY_AUTH_TOKEN
        sync: false

      # Orchestrator URL
      - key: ORCHESTRATOR_URL
        value: https://story-magic-orchestrator.onrender.com

  # =============================================================================
  # ORCHESTRATOR SERVICE (Node.js/Express)
  # =============================================================================
  - type: web
    name: story-magic-orchestrator
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    numInstances: 1

    # Node/pnpm versions
    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@latest --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @story-magic/orchestrator build
    startCommand: pnpm --filter @story-magic/orchestrator start

    # Health check
    healthCheckPath: /health

    # Disk for temporary audio files
    disk:
      name: audio-storage
      mountPath: /var/data/audio
      sizeGB: 1

    # Environment variables
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # Supabase
      - key: SUPABASE_URL
        value: https://vycfkqkdaszlhvaedxub.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_iC0xz4Fakt9BNb88nDV2iA_2luzdMt4
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # AI Services
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

      # Sentry
      - key: SENTRY_DSN
        value: https://b06f55eedd1ad8fdedc4cabc42c48c12@o4510606462550016.ingest.us.sentry.io/4510733770948608

      # Rate Limiting (Upstash)
      - key: UPSTASH_REDIS_REST_URL
        value: https://huge-finch-40198.upstash.io
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # Monitoring (Checkly)
      - key: CHECKLY_PING_URL
        value: https://ping.checklyhq.com/a1a3f468-b4d8-4328-968c-548962424c1d

      # Logging
      - key: LOG_LEVEL
        value: info

      # Auth
      - key: AUTH_DISABLED
        value: "false"

      # Audio storage path
      - key: AUDIO_STORAGE_PATH
        value: /var/data/audio

