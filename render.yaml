# Render Blueprint for Story Magic
# Deploy with: https://render.com/docs/infrastructure-as-code
#
# This blueprint defines two services:
# 1. Web (Next.js frontend) - User-facing application
# 2. Orchestrator (Node.js backend) - Audio generation pipeline

services:
  # =============================================================================
  # WEB SERVICE (Next.js)
  # =============================================================================
  - type: web
    name: story-magic-web
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    numInstances: 1

    # Node/pnpm versions
    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @story-magic/web build
    startCommand: pnpm --filter @story-magic/web start

    # Health check
    healthCheckPath: /

    # Environment variables
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production

      # Supabase (set in Render dashboard)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

      # Sentry (set in Render dashboard)
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false

      # Orchestrator URL (set in Render dashboard)
      - key: ORCHESTRATOR_URL
        sync: false

  # =============================================================================
  # ORCHESTRATOR SERVICE (Node.js/Express)
  # =============================================================================
  - type: web
    name: story-magic-orchestrator
    runtime: node
    region: oregon
    plan: standard
    branch: main
    autoDeploy: true
    # Scale up: increase numInstances when traffic demands.
    # No in-process state - jobs are tracked in Supabase, audio in persistent disk.
    numInstances: 1

    # Node/pnpm versions
    buildCommand: |
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @story-magic/orchestrator build
    startCommand: pnpm --filter @story-magic/orchestrator start

    # Health check
    healthCheckPath: /health

    # Disk for temporary audio files
    disk:
      name: audio-storage
      mountPath: /var/data/audio
      sizeGB: 1

    # Environment variables
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # Supabase (set in Render dashboard)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # AI Services
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

      # Sentry (set in Render dashboard)
      - key: SENTRY_DSN
        sync: false

      # Rate Limiting (Upstash - set in Render dashboard)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # Monitoring (Checkly - set in Render dashboard)
      - key: CHECKLY_PING_URL
        sync: false

      # Logging
      - key: LOG_LEVEL
        value: info

      # TTS concurrency (default 6, reduce if memory constrained)
      - key: TTS_CONCURRENCY
        value: "6"

      # Web frontend URL (for CORS allowlist on orchestrator)
      - key: WEB_URL
        sync: false

      # Audio output directory (persistent disk mount)
      - key: AUDIO_OUTPUT_DIR
        value: /var/data/audio

# =============================================================================
# SECRETS TO SET IN RENDER DASHBOARD (sync: false)
# =============================================================================
#
# Web:
#   - NEXT_PUBLIC_SUPABASE_URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY
#   - NEXT_PUBLIC_SENTRY_DSN
#   - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   - STRIPE_SECRET_KEY
#   - STRIPE_WEBHOOK_SECRET
#   - SENTRY_AUTH_TOKEN
#   - ORCHESTRATOR_URL
#
# Orchestrator:
#   - SUPABASE_URL
#   - SUPABASE_ANON_KEY
#   - SUPABASE_SERVICE_ROLE_KEY
#   - OPENAI_API_KEY
#   - GROQ_API_KEY
#   - ELEVENLABS_API_KEY
#   - UPSTASH_REDIS_REST_URL
#   - UPSTASH_REDIS_REST_TOKEN
#   - SENTRY_DSN
#   - CHECKLY_PING_URL
#   - WEB_URL
#
# IMPORTANT: Never put actual secret values in this file.
# All secrets must be set via the Render dashboard only.
#
# =============================================================================
# PLAN OPTIONS
# =============================================================================
#
# starter:  $7/mo  - 512MB RAM, 0.5 CPU  (staging)
# standard: $25/mo - 2GB RAM, 1 CPU      (production)
# pro:      $85/mo - 4GB RAM, 2 CPU      (high traffic)
#
# Orchestrator may need 'standard' for FFmpeg memory requirements.
