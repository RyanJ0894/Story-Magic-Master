version: '3.8'

services:
  # Consolidated Orchestrator - Node.js/Express
  # Now includes Director functionality (script parsing, voice selection)
  orchestrator:
    build:
      context: ./packages/orchestrator
      dockerfile: Dockerfile
    ports:
      - "22002:22002"
    environment:
      - PORT=22002
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DIRECTOR_MODEL=${DIRECTOR_MODEL:-openai/gpt-4.1}
      - AUDIO_DIRECTOR_MODEL=${AUDIO_DIRECTOR_MODEL:-openai/gpt-4.1}
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
    volumes:
      - ./packages/orchestrator:/app
      - /app/node_modules
      - orchestrator-output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:22002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  orchestrator-output:

networks:
  default:
    name: story-magic-network
